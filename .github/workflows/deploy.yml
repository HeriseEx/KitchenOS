name: Deploy to GitHub Pages

on:
  push:
    branches: [ mvp ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 1. Build and Deploy for Vercel (Root Path)
      - name: Build Web for Vercel
        run: |
          flutter config --enable-web
          flutter pub get
          flutter build web --release --base-href "/"
          # Copy vercel.json to build output for SPA routing support
          cp vercel.json build/web/

      - name: Deploy to vercel-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: vercel-pages

      # 2. Build and Deploy for GitHub Pages (Repo Path)
      - name: Build Web for GitHub Pages
        run: |
          REPO_NAME="/${GITHUB_REPOSITORY#*/}/"
          echo "Building with base-href: $REPO_NAME"
          flutter build web --release --base-href "$REPO_NAME"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
